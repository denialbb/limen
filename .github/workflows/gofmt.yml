name: gofmt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repo and runs a formatting check; nothing writes back.
permissions:
  contents: read

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No git operations after checkout need the token.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            echo ""
            echo "Fix with: gofmt -w internal/ cmd/"
            exit 1
          fi
