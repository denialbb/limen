name: tui-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repo, builds, and runs the E2E gate; nothing writes back.
permissions:
  contents: read

jobs:
  tui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No git operations after checkout need the token.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      # The Go side invokes the mock backend as `python -m limen.mock.*`
      # (hardcoded `python`, not `python3`). setup-python puts a `python` on
      # PATH so the mock subprocesses can start on the ubuntu runner.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Build limen
        run: go build -o limen ./cmd/limen
      - name: Headless TUI E2E gate (mock lifecycle -> COMMITTED)
        # tmux is preinstalled on ubuntu-latest, so both pipe and tmux modes
        # run. The script self-skips tmux mode if tmux is ever unavailable.
        run: ./scripts/test-tui-e2e.sh
